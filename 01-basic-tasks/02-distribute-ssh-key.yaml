---
- name: Distribute SSH public key of given user
  hosts: all
  become: true

  vars:
    user_name: "berk"
    pubkey_path: "/tmp/id_ed25519.pub"
    ansible_user: "root"

  tasks:
    - name: Distribute the SSH key
      ansible.posix.authorized_key:
        user: "{{ user_name }}"
        key: "{{ lookup('file', pubkey_path) }}"
        state: present
